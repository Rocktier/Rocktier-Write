name: Checks

# Write 此前唯一的 push 工作流是 notify-family-gate：build.yml 只在 tag /
# 手动触发，push 不跑类型检查、单测与 clippy（2026-10-19~20 grill-me 找茬
# A1，用户第一性原则拍板修复）。本文件把 MD/Sign 仓同配方的 Tests & Lints
# 作业挂到 push —— 配方零改动，只换触发条件。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Tests & Lints
    # macOS, not ubuntu: cargo test/clippy compile the Tauri crate, which on Linux
    # needs glib/gtk/webkit system libraries the bare runner does not have. Here it
    # compiles against the same platform the shipping build uses.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: npm ci
      - name: Type check + unit tests
        run: |
          npm run build
          npm test
      - name: Rust tests + clippy
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
