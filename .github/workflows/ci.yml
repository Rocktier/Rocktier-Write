name: Checks

# Write 此前唯一的 push 工作流是 notify-family-gate：build.yml 只在 tag /
# 手动触发，push 不跑类型检查、单测与 clippy（2026-10-19~20 grill-me 找茬
# A1，用户第一性原则拍板修复）。本文件把 MD/Sign 仓同配方的 Tests & Lints
# 作业挂到 push —— 配方零改动，只换触发条件。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Tests & Lints
    # macOS, not ubuntu: cargo test/clippy compile the Tauri crate, which on Linux
    # needs glib/gtk/webkit system libraries the bare runner does not have. Here it
    # compiles against the same platform the shipping build uses.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Ensure clippy component
        # dtolnay action 的 components: clippy 在部分 macOS runner 镜像上装不到
        # 活动 toolchain（CAD db7b5fc 曾报 cargo-clippy is not installed for
        # 1.98.0，而同配方的 pic2webp/MD 同一晚却过了 —— 镜像状态差异）。
        # 显式对当前 toolchain 补装，幂等，防复发。
        run: rustup component add clippy
      - name: Install dependencies
        run: npm ci
      - name: Type check + unit tests
        run: |
          npm run build
          npm test
      - name: fs permission audit
        # 草稿恢复的 stale 判定靠 stat()：src/App.tsx:361 把 stat 包在
        # try/catch 里（"文件不存在就当没更新"），而 capabilities 一直只授了
        # read-text-file / write-text-file / exists —— 运行时被 ACL 拒、
        # 被 catch 吞掉，stale 恒 false，于是无论磁盘是否更新都提示"草稿更新"，
        # 用户点恢复就用旧草稿盖掉磁盘新内容。这是与 MD 同款的静默数据丢失
        # 路径（D-142），此处对账「源码要的 fs API」与「配置给的权限」。
        run: npm run verify:fs
      - name: Rust tests + clippy
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
