# Rocktier Write — CI build & release
# macOS aarch64 dmg (Apple Silicon only; Intel <5% share, macOS Tahoe drops Intel)
# Windows MSI (WiX) for direct download
# Windows MSIX job reserved for future Microsoft Store submission (follow-up commit)

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── macOS (Apple Silicon only) ─────────────────────────────────────────
  # Ad-hoc signing: Tauri passes APPCLE_SIGNING_IDENTITY="" → bundles .app
  # with ad-hoc signature so unsigned dmgs don't trigger Gatekeeper on load.
  build-macos:
    runs-on: macos-latest
    env:
      # Empty signing identity = ad-hoc signing (no Apple Developer cert needed)
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Build (Tauri macOS aarch64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Inherit ad-hoc signing env from job level
        with:
          tagName: ${{ github.ref_type == 'tag' && 'v__VERSION__' || '' }}
          releaseName: "Rocktier Write v__VERSION__"
          releaseBody: "Rocktier Write release."
          releaseDraft: true
          prerelease: false
          args: "--target aarch64-apple-darwin"

      # Verify the bundle was ad-hoc signed & strip any inherited quarantine xattr
      - name: Verify + clean bundle
        run: |
          set -e
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" -print -quit)
          [ -z "$APP" ] && { echo "::error::.app not found"; exit 1; }
          echo "Signing status:"
          codesign -dv "$APP" 2>&1 || true
          xattr -cr "$APP"
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" -print -quit)
          if [ -n "$DMG" ]; then
            xattr -cr "$DMG"
            echo "Cleaned quarantine attrs on dmg"
          fi
          echo "✅ ad-hoc signing confirmed + quarantine cleared"

  # ── Windows (MSI via WiX) ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Build (Tauri Windows MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_type == 'tag' && 'v__VERSION__' || '' }}
          releaseName: "Rocktier Write v__VERSION__"
          releaseBody: "Rocktier Write release."
          releaseDraft: true
          prerelease: false
          args: ""

# MSIX for Store: follow-up commit once MSI build is stable.
#
# Plan:
#   1. Add bundle.windows.msix config block to tauri.conf.json
#        ((generatePackage: false, manifest with app identity — see
#         https://v2.tauri.app/distribute/msix/ )
#   2. Add third job: build-msix Windows runner runs
#        cargo-tauri tauri bundle --bundle msix
#        produces target/release/bundle/msix/Rocktier Write_1.1.0_x64.msix
#   3. Upload .msix to release assets
#   4. Submit .msix manually to Partner Center (auto-signed by Store)
#
# Why not now: msix bundle config requires testing Package Identity /
# capabilities; MSI already covers direct download users.
