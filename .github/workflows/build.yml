# Rocktier Write — CI build & release
# macOS aarch64 dmg (Apple Silicon only; Intel <5% share, macOS Tahoe drops Intel)
# Windows MSI (WiX) for direct download
# Windows MSIX (Microsoft Store) via @choochmeque/tauri-windows-bundle

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── macOS (Apple Silicon only) ─────────────────────────────────────────
  # Ad-hoc signing: Tauri passes APPCLE_SIGNING_IDENTITY="" → bundles .app
  # with ad-hoc signature so unsigned dmgs don't trigger Gatekeeper on load.
  build-macos:
    runs-on: macos-latest
    env:
      # Empty signing identity = ad-hoc signing (no Apple Developer cert needed)
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Build (Tauri macOS aarch64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Inherit ad-hoc signing env from job level
        with:
          tagName: ${{ github.ref_type == 'tag' && 'v__VERSION__' || '' }}
          releaseName: "Rocktier Write v__VERSION__"
          releaseBody: "Rocktier Write release."
          releaseDraft: true
          prerelease: false
          args: "--target aarch64-apple-darwin"

      # Verify the bundle was ad-hoc signed & strip any inherited quarantine xattr
      - name: Verify + clean bundle
        run: |
          set -e
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" -print -quit)
          [ -z "$APP" ] && { echo "::error::.app not found"; exit 1; }
          echo "Signing status:"
          codesign -dv "$APP" 2>&1 || true
          xattr -cr "$APP"
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" -print -quit)
          # Tauri 在 targets:"all" 下确实会产出 .dmg（这一步一直能找到它），
          # 但此前**从不把它上传** —— 而 REQUIRED_ASSETS 却要求 `\.dmg$`。
          # 于是资产校验永远不通过，tag 发版卡在最后一步（2026-10-04 首次撞上：
          # v1.2.0 的两端包都构建成功、已附加，publish 步骤失败）。
          #
          # 与 PDF 那套「签名后重打 dmg」不同：那里签名发生在构建**之后**
          # （用 APPLE_CERT_P12 导入临时 keychain），dmg 里装的是签名前的 app，
          # 所以必须重打。本仓是 `APPLE_SIGNING_IDENTITY="-"` 的 job 级变量，
          # tauri-action 构建时就 ad-hoc 签名 .app 再打进 dmg —— 顺序已经是对的，
          # 不需要重打。
          if [ -z "$DMG" ]; then
            echo "::error::.dmg not found — tauri.conf.json 的 bundle.targets 应为 all 或含 dmg"
            exit 1
          fi
          xattr -cr "$DMG"
          echo "✅ ad-hoc signing confirmed + quarantine cleared (app & dmg)"

      # 把 .dmg 与 .app 都**拷到工作目录**再 attach。
      #
      # 为什么不用 `files: src-tauri/.../bundle/dmg/*.dmg` 直接传：
      # `softprops/action-gh-release` 的 files 里 glob 匹配不到文件时**只发 warning
      # 不失败**，步骤照样是绿的 —— 于是「上传成功」的表象下资产根本没进去，
      # 直到最后 REQUIRED_ASSETS 校验才暴露。实测踩过：v1.2.0 第一次改成传 dmg 时，
      # `Attach macOS artifacts` 显示 success，校验却仍缺 .dmg。
      #
      # 拷到工作目录后，上面的 `ls` 能在上传前就确认文件真的在，
      # 缺了就当场报错 —— 失败发生在离原因最近的那一步。
      - name: Stage macOS artifacts
        # 只在 tag push 上跑。
        # ⚠️ 早先漏了这个条件：分支 push 也会走这一步，于是**每次普通推送都红**
        #（实测 e00dae3 的 build-macos 就是这样失败的）。而它存在的意义仅为
        # tag 发版时把产物搬到工作目录供 attach 用 —— 分支 push 不需要。
        # 必须与下面的 Attach 保持同样的条件，否则就是「一边传一边不传」。
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" -print -quit)
          [ -z "$APP" ] && { echo "::error::.app not found"; exit 1; }
          ditto -c -k --keepParent "$APP" "Rocktier.Write_aarch64.app.zip"

          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" -print -quit)
          if [ -z "$DMG" ]; then
            echo "::error::.dmg not found — 检查 tauri.conf.json 的 bundle.targets（应为 all 或含 dmg）"
            exit 1
          fi
          # Tauri 的 dmg 命名实测为 <productName>_<version>_<arch>.dmg，
          # 而 productName 是「Rocktier Write」——**带空格**，不是 Rocktier.Write。
          # 本地实跑 `tauri build --bundles dmg` 确认：
          #   bundle/dmg/Rocktier Write_1.2.0_aarch64.dmg
          # 所以文件名一律用 `basename` 现取，绝不写死 ——
          # 写死会让 attach 的 glob 匹配不到，而 softprops/action-gh-release
          # 对「没匹配到」只发 warning 不报错，步骤照样绿，直到资产校验才暴露。
          NAME=$(basename "$DMG")
          cp "$DMG" "./$NAME"
          xattr -cr "./$NAME" || true
          echo "DMG_NAME=$NAME" >> "$GITHUB_ENV"

          echo "Staged:"
          ls -la Rocktier.Write_aarch64.app.zip "./$NAME"

      # 同时上传 .dmg 与 .app.zip：
      #   · .dmg —— macOS 的原生分发形态，REQUIRED_ASSETS 要求的那个
      #   · .app.zip —— 保留。.dmg 在未签名情况下 Gatekeeper 仍会拦（Q8 已定
      #     暂不做代码签名），右键「打开」可绕过；.app.zip 给不愿挂载镜像的用户
      #     一个直接解压就能用的选择。两者并存不增加维护成本（同一个构建产物）。
      - name: Attach macOS artifacts to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            Rocktier.Write_aarch64.app.zip
            ${{ env.DMG_NAME }}
          generate_release_notes: false

  # ── Windows (MSI via WiX) ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Build (Tauri Windows MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_type == 'tag' && 'v__VERSION__' || '' }}
          releaseName: "Rocktier Write v__VERSION__"
          releaseBody: "Rocktier Write release."
          releaseDraft: true
          prerelease: false
          args: ""

      # ── MSIX (Microsoft Store) ──────────────────────────────────────────
      # tauri-windows-bundle 内部会跑 npm run tauri build -- --target
      # x86_64-pc-windows-msvc --no-bundle（MSI/NSIS 跳过），再用 msixbundle-cli
      # 打包。Identity（Name/Publisher）取 src-tauri/gen/windows/bundle.config.json，
      # 必须与 Partner Center 预留身份一致；Store 侧重新签名，无需 pfx。
      # md 文件关联自动从 tauri.conf.json 的 bundle.fileAssociations 折叠进来。
      - name: Build MSIX (Microsoft Store)
        # MSIX 直装走 direct 付费墙（微软商店渠道已弃用，2026-10-05 终裁 C3）。
        # 若未来恢复商店渠道：本步需加 env ROCKTIER_CHANNEL: store（10.8.2/10.8.4）。
        run: npm run tauri:windows:build

      - name: Upload MSIX artifact (branch)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Rocktier-Write-windows-msix
          path: src-tauri/target/msix/*.msix*
          if-no-files-found: error

      - name: Attach MSIX to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/msix/*.msix*
          generate_release_notes: false

  # 发布闸门：两平台都传完之后，先校验资产清单齐全，再把草稿发布为 latest。
  # 不齐就保留草稿并让 job 失败 —— 用户永远不会拿到残缺包。
  publish:
    name: Verify & Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUIRED_ASSETS: '\.dmg$ \.app\.zip$ \.msi$ \.exe$ \.msix$ \.msixbundle$'
    steps:
      - name: Verify assets then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # 必须显式指定仓库：这个 job **没有 actions/checkout**（它不需要源码，
          # 只需要读 Release 状态）。没有 checkout 就没有 git remote，gh 无从推断
          # 仓库，会直接报「不是 Git 仓库」并退出非 0。
          #
          # ⚠️ 原来的 `2>/dev/null || true` 把这个错误吞了，于是 `assets` 永远是空串，
          # 轮询 30 次全打印「waiting for uploads (0 so far)」，最后报六个 missing ——
          # 报错信息完全指错方向，看起来像「GitHub 资产没上传上去」，
          # 实际上传早在前两个 job 里完成了。
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Verifying release $TAG"
          # Uploads are done (needs: build jobs); GitHub's asset API can lag
          # minutes before a freshly-uploaded file appears in `gh release view`.
          # Poll up to ~10 min with an initial settle delay before giving up.
          sleep 20
          for i in $(seq 1 30); do
            # 保留 || true 仅为让轮询能继续重试（资产 API 确实会lag），
            # 但把 stderr 打出来 —— 之前把它一并丢掉，导致真实的配置错误
            # 被伪装成「资产还没上传」，排查方向完全跑偏。
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' || true)
            echo "  poll #$i: $(printf '%s\n' "$assets" | grep -c . || true) asset(s) visible"
            ok=1
            for pat in $REQUIRED_ASSETS; do
              printf '%s\n' "$assets" | grep -Eq "$pat" || ok=0
            done
            [ "$ok" -eq 1 ] && break
            echo "  waiting for uploads ($(printf '%s\n' "$assets" | grep -c . || true) so far)..."
            sleep 20
          done
          missing=0
          for pat in $REQUIRED_ASSETS; do
            if ! printf '%s\n' "$assets" | grep -Eq "$pat"; then
              echo "::error::release $TAG missing asset matching $pat"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release $TAG is missing required assets — left as DRAFT for manual review"
            exit 1
          fi
          echo "All required assets present; publishing $TAG"
          gh release edit "$TAG" --draft=false --latest
