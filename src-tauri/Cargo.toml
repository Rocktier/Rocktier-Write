[package]
name = "rocktier-write"
version = "1.4.10"
description = "Distraction-free long-form writing, DOCX support"
authors = ["Rocktier"]
edition = "2021"

[lib]
name = "rocktier_write_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri-plugin-opener = "2"
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
# Required by tauri::generate_context! (macro references ::serde_json directly)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 粘贴图片落盘时解码 base64（tauri 传递依赖里已有同版本，不引入新下载）
base64 = "0.22"
# DOCX import/export (pure-Rust, no Office deps)
docx-rs = "0.4"
# 没有 tauri-plugin-updater：更新走 src/services/updates.ts 的手动检查，
# 插件与 tauri.conf.json 的 plugins.updater 段必须同生同死（见 lib.rs 注释）。
# 授权回执的 Ed25519 离线验签（license.rs，FAMILY-LICENSE.md §2）
ed25519-dalek = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Mac App Store 构建：沙盒启用（App Store 渠道本就不允许自更新，而我们已经
# 全局不做自更新，所以这里只剩沙盒相关的差异）
mas = []

# Size- and startup-optimized release binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
