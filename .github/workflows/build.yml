# Rocktier Write — CI build & release
# Builds macOS dmg + Windows msi on GitHub Actions.
# Triggered on push to main or tag v*.

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# tauri-action needs contents: write to create draft releases
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm deps
        run: npm ci

      # macOS ad-hoc signing: bypass Gatekeeper for unsigned dev builds
      # Real signing with Apple Developer cert replaces this in production
      - name: macOS ad-hoc sign
        if: matrix.platform == 'macos-latest'
        run: |
          echo "Ad-hoc signing will be applied post-build"

      - name: Build (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && 'v__VERSION__' || '' }}
          releaseName: "Rocktier Write v__VERSION__"
          releaseBody: "Rocktier Write release."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
